<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Georama — Votre maquette</title>
<!-- v2.1 (27 nov. 2026) : version cellulaire compacte (carte 84 px à gauche, deux boutons côte à côte). v2.0 : la maquette de la personne reste visible au panier : carte du lieu avec le cadre, type, largeur,
     gamme et cadre, bouton « Modifier ma maquette », rappel prix final / 3 semaines / satisfait ou remboursé.
     v1 (20 oct. 2026) : lien de visualisation 3D seulement. Protocole inchangé : la page panier envoie { type: "georama-liens", liens: [{ nom, lien }] }. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; font-family: Montserrat, system-ui, sans-serif; color: #F2F1EA; -webkit-font-smoothing: antialiased; }
  .boite { display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding: 14px 18px; border: 1.5px solid #9AA85C; border-radius: 14px; background: rgba(154, 168, 92, .12); }
  .carte { flex: none; width: 112px; height: 84px; border-radius: 10px; overflow: hidden; background: #2b3a2e; position: relative; border: 1.5px solid rgba(154,168,92,.6); }
  .carte .leaflet-container { background: #2b3a2e; font: inherit; }
  .carte .leaflet-control-attribution { font-size: 8px; padding: 0 3px; background: rgba(255,255,255,.75); color: #333; }
  .carte .leaflet-control-attribution a { color: #333; }
  .carte img.leaflet-tile { filter: saturate(.85); }
  .txt { flex: 1 1 260px; min-width: 0; }
  h2 { margin: 0 0 3px; font-size: 16px; font-weight: 700; line-height: 1.3; }
  p { margin: 0; font-size: 13px; line-height: 1.45; color: #D9DCC8; }
  p.details { color: #F2F1EA; font-weight: 600; }
  p.details span + span::before { content: " · "; color: #9AA85C; }
  .liens { display: flex; flex-wrap: wrap; gap: 8px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #9AA85C; color: #111311; font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap; }
  a.btn:hover { background: #AFBD70; }
  a.sec { background: transparent; color: #F2F1EA; border: 1.5px solid rgba(242, 241, 234, .45); font-weight: 600; }
  @media (max-width: 600px) {
    .boite { padding: 12px; gap: 10px 12px; }
    .carte { width: 84px; height: 84px; }
    .txt { flex: 1 1 180px; }
    h2 { font-size: 14.5px; }
    p { font-size: 12.5px; }
    .liens { width: 100%; flex-wrap: nowrap; }
    a.btn { flex: 1 1 0; min-height: 42px; padding: 0 8px; font-size: 13px; white-space: normal; text-align: center; line-height: 1.15; }
  }
</style>
</head>
<body>
<div class="boite" id="boite" hidden>
  <div class="carte" id="carte" aria-hidden="true"></div>
  <div class="txt">
    <h2 id="titre">Votre maquette</h2>
    <p class="details" id="details"></p>
    <p id="note">Prix final, aucune taxe. Fabriquée au Lac-Saint-Jean en environ 3 semaines. Satisfait ou remboursé 30 jours.</p>
  </div>
  <div class="liens" id="liens"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const boite = document.getElementById("boite"), liens = document.getElementById("liens"), details = document.getElementById("details"), titre = document.getElementById("titre");
  const TYPES = { proprio: "Terre à bois", chasse: "Territoire de chasse", peche: "Lac de pêche", pleinair: "Plein air", ville: "Ville", entreprise: "Site d'entreprise", ferme: "Ferme" };
  const GAMMES = { boreal: "Boréal", sapiniere: "Sapinière", terre: "Terre", arctique: "Arctique", mono: "Monochrome" };
  const CADRES = { sans: "sans cadre", bois: "cadre bois pâle", blanc: "cadre blanc", noir: "cadre noir" };
  const sur = (u) => { try { const x = new URL(u); return /(^|\.)georama\.ca$/.test(x.hostname) ? x : null; } catch (e) { return null; } };
  let carte = null, cadre = null;
  function km(l) { return l >= 10 ? Math.round(l) + " km" : String(Math.round(l * 10) / 10).replace(".", ",") + " km"; }
  function rect(lat, lon, l, f, r) {
    const kLat = 110.574, kLon = 111.32 * Math.cos(lat * Math.PI / 180), a = l / 2, b = f === "rect" ? a * 1.2 : a;
    const t = (r || 0) * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    const pts = f === "round" ? [...Array(36)].map((_, i) => [a * Math.cos(i * Math.PI / 18), a * Math.sin(i * Math.PI / 18)]) : [[-a, -b], [a, -b], [a, b], [-a, b]];
    return pts.map(([x, y]) => { const X = x * c + y * s, Y = -x * s + y * c; return [lat + Y / kLat, lon + X / kLon]; });
  }
  function dessiner(u) {
    const q = u.searchParams, lat = +q.get("lat"), lon = +q.get("lon"), l = +q.get("l") || 1;
    if (!isFinite(lat) || !isFinite(lon) || !window.L) { document.getElementById("carte").hidden = true; return; }
    document.getElementById("carte").hidden = false;
    if (!carte) {
      carte = L.map("carte", { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(carte);
    }
    if (cadre) carte.removeLayer(cadre);
    cadre = L.polygon(rect(lat, lon, l, q.get("f") || "rect", +q.get("r") || 0), { color: "#ff6a00", weight: 3, fillColor: "#ff6a00", fillOpacity: .12, interactive: false }).addTo(carte);
    setTimeout(() => { carte.invalidateSize(); carte.fitBounds(cadre.getBounds(), { padding: [6, 6] }); }, 50);
  }
  function decrire(u) {
    const q = u.searchParams, out = [];
    const t = TYPES[q.get("p")]; if (t) out.push(t);
    const l = +q.get("l"); if (l) out.push(km(l) + " de large");
    const g = GAMMES[q.get("g")]; if (g) out.push("gamme " + g);
    const c = CADRES[q.get("cd")]; if (c) out.push(c);
    const lots = q.get("lots"); if (lots) out.push((lots.split(",").length > 1 ? "lots " : "lot ") + lots.split(",").join(", "));
    details.textContent = "";
    out.forEach((x) => { const s = document.createElement("span"); s.textContent = x; details.appendChild(s); });
  }
  function hauteur() { try { parent.postMessage({ type: "georama-lien-hauteur", h: document.documentElement.scrollHeight }, "*"); } catch (e) {} }
  function afficher(l) {
    liens.textContent = "";
    const ok = (l || []).map((x) => ({ nom: String(x.nom || "Ma maquette"), u: sur(x.lien) })).filter((x) => x.u).slice(0, 4);
    if (ok.length === 1) {
      titre.textContent = "Votre maquette, telle que vous l'avez créée";
      decrire(ok[0].u); dessiner(ok[0].u);
    } else {
      titre.textContent = ok.length > 1 ? "Vos " + ok.length + " maquettes" : "Votre maquette";
      details.textContent = ""; document.getElementById("carte").hidden = true;
    }
    ok.forEach((x, i) => {
      const a = document.createElement("a");
      a.className = "btn"; a.href = x.u.href; a.target = "_top";
      a.textContent = ok.length > 1 ? "Revoir la maquette " + (i + 1) + " en 3D" : "Revoir ma maquette en 3D";
      liens.appendChild(a);
    });
    if (ok.length === 1) {
      const m = document.createElement("a");
      m.className = "btn sec"; m.href = ok[0].u.href; m.target = "_top"; m.textContent = "Modifier ma maquette";
      liens.appendChild(m);
    }
    boite.hidden = ok.length === 0;
    hauteur(); setTimeout(hauteur, 400);
  }
  window.addEventListener("message", (e) => { const d = e.data || {}; if (d.type === "georama-liens") afficher(d.liens); });
  window.addEventListener("resize", hauteur);
  try { parent.postMessage({ type: "georama-lien-pret" }, "*"); } catch (e) {}
  // aperçu direct : ?test=1
  if (/[?&]test=1/.test(location.search)) afficher([{ nom: "Maquette Georama", lien: "https://www.georama.ca/zone?p=proprio&lat=46.28135&lon=-74.93473&l=0.59&f=rect&r=0&lots=5071034&c=rliozc&g=boreal&cd=sans" }]);
})();
</script>
</body>
</html>
