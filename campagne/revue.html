<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Reels de lancement · revue</title>
<style>
:root{--f:#1b1d1a;--v:#a3b567;--g:#f2f1ec}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--g);color:var(--f)}
header{background:var(--f);color:#fff;padding:20px 16px}header h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.8;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

.paire{display:grid;grid-template-columns:1fr 1fr;gap:10px}
figure{margin:0}video{width:100%;aspect-ratio:9/16;background:#000;border-radius:8px;display:block}
